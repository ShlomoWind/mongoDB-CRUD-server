apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sh-z-wind-dev
  name: mongodb
spec:
  selector:
    matchLabels:
      app: mongodb
  replicas: 1
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongodb/mongodb-community-server:latest
          ports:
            - containerPort: 27017
          volumeMounts:
          - name: mongodb-pv
            mountPath: /data/db
      volumes:
        - name: mongodb-pv
          persistentVolumeClaim:
            claimName: mongodb-pv